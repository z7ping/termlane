[package]
name = "xterminal-pro"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-stronghold = "2"
ssh2 = { version = "0.9", features = ["vendored-openssl"] }
tokio = { version = "1", features = ["full"] }
keyring = "3"
aes-gcm = "0.10"
rand = "0.8"
dirs = "5"
crossbeam-channel = "0.5"
portable-pty = "0.8"
reqwest = { version = "0.11", features = ["json"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

# Disable GTK/gobject dependencies for headless mode
[patch.crates-io]
gobject-sys = { git = "https://github.com/gtk-rs/gobject-sys.git", optional = true }
glib-sys = { git = "https://github.com/gtk-rs/glib-sys.git", optional = true }
gdk-sys = { git = "https://github.com/gtk-rs/gdk-sys.git", optional = true }
gtk-sys = { git = "https://github.com/gtk-rs/gtk-sys.git", optional = true }