# XTerminal Pro CI/CD
# 工作流程：dev 分支开 PR → 合并到 main → 自动构建
# Runner 配置（Gitea Act Runner）：
#   runner-22796302: linux, x64, desktop, docker, container（Podman 容器构建）
#   runner-22796306: windows, x64, desktop（原生 MSVC 构建）
# 容器镜像：xterminal-builder（需在 Runner 宿主机预构建：podman build -f Dockerfile.builder -t xterminal-builder .）
# 默认触发：check (Linux) + Windows .msi
# 手动触发：Linux .deb / macOS .dmg

name: Build XTerminal Pro

on:
  # PR 合并到 main 时触发构建（手动合并 → 自动构建）
  pull_request:
    branches: [main]
    types: [closed]
  # tag 仍然直接触发
  push:
    tags: ['v*']
  # 手动触发
  workflow_dispatch:
    inputs:
      build_linux:
        description: '构建 Linux .deb'
        required: false
        type: boolean
        default: false
      build_macos:
        description: '构建 macOS .dmg'
        required: false
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 2

jobs:
  # ==================== 检查（Linux runner + Podman 容器）===================
  check:
    name: Lint & Test
    runs-on: linux
    container:
      image: xterminal-builder
    steps:
      - name: Checkout
        uses: https://gitea.com/actions/checkout@v4

      - name: Install frontend deps
        run: npm ci

      - name: Rust cache
        uses: https://gitea.com/actions/cache@v4
        with:
          path: |
            /root/.cargo/bin/
            /root/.cargo/registry/index/
            /root/.cargo/registry/cache/
            /root/.cargo/git/db/
            src-tauri/target/
          key: check-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: Frontend type check
        run: npx vue-tsc --noEmit

      - name: Rust check
        working-directory: src-tauri
        run: cargo check

      - name: Rust test
        working-directory: src-tauri
        run: cargo test

  # ==================== Windows .msi（Windows runner，默认触发）====================
  build-windows:
    name: Windows (.msi)
    runs-on: windows
    needs: [check]
    steps:
      - name: Checkout
        uses: https://gitea.com/actions/checkout@v4

      - name: Setup Node.js
        uses: https://gitea.com/actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install frontend deps
        run: npm ci

      - name: Setup Rust
        uses: https://gitea.com/dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: https://gitea.com/actions/cache@v4
        with:
          path: |
            ~\.cargo\bin\
            ~\.cargo\registry\index\
            ~\.cargo\registry\cache\
            ~\.cargo\git\db\
            src-tauri\target\
          key: win-msi-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: Build frontend
        run: npm run build

      - name: Build .msi
        run: npx tauri build --bundles msi

      - name: Upload .msi artifact
        uses: https://gitea.com/actions/upload-artifact@v4
        with:
          name: xterminal-pro-msi
          path: src-tauri\target\release\bundle\msi\*.msi
          retention-days: 30

  # ==================== Linux .deb（Linux runner + Podman，手动触发）====================
  build-linux:
    name: Linux (.deb)
    runs-on: linux
    container:
      image: xterminal-builder
    if: >-
      (github.event_name == 'workflow_dispatch' && github.event.inputs.build_linux == 'true') ||
      (startsWith(github.ref, 'refs/tags/v'))
    needs: [check]
    steps:
      - name: Checkout
        uses: https://gitea.com/actions/checkout@v4

      - name: Install frontend deps
        run: npm ci

      - name: Rust cache
        uses: https://gitea.com/actions/cache@v4
        with:
          path: |
            /root/.cargo/bin/
            /root/.cargo/registry/index/
            /root/.cargo/registry/cache/
            /root/.cargo/git/db/
            src-tauri/target/
          key: deb-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: Build frontend
        run: npm run build

      - name: Build .deb
        run: cargo tauri build --bundles deb

      - name: Upload .deb artifact
        uses: https://gitea.com/actions/upload-artifact@v4
        with:
          name: xterminal-pro-deb
          path: src-tauri/target/release/bundle/deb/*.deb
          retention-days: 30

  # ==================== macOS .dmg（Linux runner + Podman，手动触发）====================
  build-macos:
    name: macOS (.dmg)
    runs-on: linux
    container:
      image: xterminal-builder
    if: >-
      (github.event_name == 'workflow_dispatch' && github.event.inputs.build_macos == 'true') ||
      (startsWith(github.ref, 'refs/tags/v'))
    needs: [check]
    steps:
      - name: Checkout
        uses: https://gitea.com/actions/checkout@v4

      - name: Install frontend deps
        run: npm ci

      - name: Rust cache
        uses: https://gitea.com/actions/cache@v4
        with:
          path: |
            /root/.cargo/bin/
            /root/.cargo/registry/index/
            /root/.cargo/registry/cache/
            /root/.cargo/git/db/
            src-tauri/target/
          key: dmg-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: Build frontend
        run: npm run build

      - name: Build .dmg
        run: cargo tauri build --bundles dmg

      - name: Upload .dmg artifact
        uses: https://gitea.com/actions/upload-artifact@v4
        with:
          name: xterminal-pro-dmg
          path: src-tauri/target/release/bundle/dmg/*.dmg
          retention-days: 30

  # ==================== Release（仅 tag 触发）===================
  release:
    name: Create Release
    needs: [build-windows, build-linux, build-macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: linux
    steps:
      - name: Download all artifacts
        uses: https://gitea.com/actions/download-artifact@v4
        with:
          path: dist
        continue-on-error: true

      - name: Create release on Gitea
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          REPO="${{ gitea.repository }}"

          curl -s -X POST \
            "https://gitea.7ping.site/api/v1/repos/${REPO}/releases" \
            -H "Authorization: token ${GITEA_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{
              \"tag_name\": \"${TAG}\",
              \"name\": \"XTerminal Pro ${TAG}\",
              \"body\": \"自动构建，见附件下载。\"
            }"

          RELEASE_ID=$(curl -s \
            "https://gitea.7ping.site/api/v1/repos/${REPO}/releases/tags/${TAG}" \
            -H "Authorization: token ${GITEA_TOKEN}" \
            | python3 -c "import json,sys; print(json.load(sys.stdin)['id'])")

          for f in dist/*/*.deb dist/*/*.msi dist/*/*.dmg; do
            [ -f "$f" ] || continue
            echo "Uploading $(basename $f)..."
            curl -s -X POST \
              "https://gitea.7ping.site/api/v1/repos/${REPO}/releases/${RELEASE_ID}/assets" \
              -H "Authorization: token ${GITEA_TOKEN}" \
              -F "attachment=@${f}"
          done
