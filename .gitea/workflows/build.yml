# XTerminal Pro CI/CD
# 宸ヤ綔娴佺▼锛歞ev 鍒嗘敮寮€ PR 鈫?鍚堝苟鍒?main 鈫?鑷姩鏋勫缓
# Runner 閰嶇疆锛圙itea Act Runner锛夛細
#   runner-22796302: linux, x64, desktop, docker, container锛圥odman 瀹瑰櫒鏋勫缓锛?#   runner-22796306: windows, x64, desktop锛堝師鐢?MSVC 鏋勫缓锛?# 瀹瑰櫒闀滃儚锛歺terminal-builder锛堥渶鍦?Runner 瀹夸富鏈洪鏋勫缓锛歱odman build -f Dockerfile.builder -t xterminal-builder .锛?# 榛樿瑙﹀彂锛歝heck (Linux) + Windows .msi
# 鎵嬪姩瑙﹀彂锛歀inux .deb / macOS .dmg

name: Build XTerminal Pro

on:
  # PR 鍚堝苟鍒?main 鏃惰Е鍙戞瀯寤猴紙鎵嬪姩鍚堝苟 鈫?鑷姩鏋勫缓锛?  pull_request:
    branches: [main]
    types: [closed]
  # tag 浠嶇劧鐩存帴瑙﹀彂
  push:
    tags: ['v*']
  # 鎵嬪姩瑙﹀彂
  workflow_dispatch:
    inputs:
      build_linux:
        description: '鏋勫缓 Linux .deb'
        required: false
        type: boolean
        default: false
      build_macos:
        description: '鏋勫缓 macOS .dmg'
        required: false
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 2

jobs:
  # ==================== 妫€鏌ワ紙Linux runner + Podman 瀹瑰櫒锛?==================
  check:
    name: Lint & Test
    runs-on: linux
    container:
      image: xterminal-builder
    steps:
      - name: Checkout
        uses: https://gitea.7ping.site/actions/checkout@v4

      - name: Install frontend deps
        run: npm ci

      - name: Rust cache
        uses: https://gitea.7ping.site/actions/cache@v4
        with:
          path: |
            /root/.cargo/bin/
            /root/.cargo/registry/index/
            /root/.cargo/registry/cache/
            /root/.cargo/git/db/
            src-tauri/target/
          key: check-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: Frontend type check
        run: npx vue-tsc --noEmit

      - name: Rust check
        working-directory: src-tauri
        run: cargo check

      - name: Rust test
        working-directory: src-tauri
        run: cargo test

  # ==================== Windows .msi锛圵indows runner锛岄粯璁よЕ鍙戯級====================
  build-windows:
    name: Windows (.msi)
    runs-on: windows
    needs: [check]
    steps:
      - name: Checkout
        uses: https://gitea.7ping.site/actions/checkout@v4

      - name: Setup Node.js
        uses: https://gitea.7ping.site/actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install frontend deps
        run: npm ci

      - name: Setup Rust
        uses: https://gitea.7ping.site/dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: https://gitea.7ping.site/actions/cache@v4
        with:
          path: |
            ~\.cargo\bin\
            ~\.cargo\registry\index\
            ~\.cargo\registry\cache\
            ~\.cargo\git\db\
            src-tauri\target\
          key: win-msi-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: Build frontend
        run: npm run build

      - name: Build .msi
        run: npx tauri build --bundles msi

      - name: Upload .msi artifact
        uses: https://gitea.7ping.site/actions/upload-artifact@v4
        with:
          name: xterminal-pro-msi
          path: src-tauri\target\release\bundle\msi\*.msi
          retention-days: 30

  # ==================== Linux .deb锛圠inux runner + Podman锛屾墜鍔ㄨЕ鍙戯級====================
  build-linux:
    name: Linux (.deb)
    runs-on: linux
    container:
      image: xterminal-builder
    if: >-
      (github.event_name == 'workflow_dispatch' && github.event.inputs.build_linux == 'true') ||
      (startsWith(github.ref, 'refs/tags/v'))
    needs: [check]
    steps:
      - name: Checkout
        uses: https://gitea.7ping.site/actions/checkout@v4

      - name: Install frontend deps
        run: npm ci

      - name: Rust cache
        uses: https://gitea.7ping.site/actions/cache@v4
        with:
          path: |
            /root/.cargo/bin/
            /root/.cargo/registry/index/
            /root/.cargo/registry/cache/
            /root/.cargo/git/db/
            src-tauri/target/
          key: deb-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: Build frontend
        run: npm run build

      - name: Build .deb
        run: cargo tauri build --bundles deb

      - name: Upload .deb artifact
        uses: https://gitea.7ping.site/actions/upload-artifact@v4
        with:
          name: xterminal-pro-deb
          path: src-tauri/target/release/bundle/deb/*.deb
          retention-days: 30

  # ==================== macOS .dmg锛圠inux runner + Podman锛屾墜鍔ㄨЕ鍙戯級====================
  build-macos:
    name: macOS (.dmg)
    runs-on: linux
    container:
      image: xterminal-builder
    if: >-
      (github.event_name == 'workflow_dispatch' && github.event.inputs.build_macos == 'true') ||
      (startsWith(github.ref, 'refs/tags/v'))
    needs: [check]
    steps:
      - name: Checkout
        uses: https://gitea.7ping.site/actions/checkout@v4

      - name: Install frontend deps
        run: npm ci

      - name: Rust cache
        uses: https://gitea.7ping.site/actions/cache@v4
        with:
          path: |
            /root/.cargo/bin/
            /root/.cargo/registry/index/
            /root/.cargo/registry/cache/
            /root/.cargo/git/db/
            src-tauri/target/
          key: dmg-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: Build frontend
        run: npm run build

      - name: Build .dmg
        run: cargo tauri build --bundles dmg

      - name: Upload .dmg artifact
        uses: https://gitea.7ping.site/actions/upload-artifact@v4
        with:
          name: xterminal-pro-dmg
          path: src-tauri/target/release/bundle/dmg/*.dmg
          retention-days: 30

  # ==================== Release锛堜粎 tag 瑙﹀彂锛?==================
  release:
    name: Create Release
    needs: [build-windows, build-linux, build-macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: linux
    steps:
      - name: Download all artifacts
        uses: https://gitea.7ping.site/actions/download-artifact@v4
        with:
          path: dist
        continue-on-error: true

      - name: Create release on Gitea
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          REPO="${{ gitea.repository }}"

          curl -s -X POST \
            "https://gitea.7ping.site/api/v1/repos/${REPO}/releases" \
            -H "Authorization: token ${GITEA_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{
              \"tag_name\": \"${TAG}\",
              \"name\": \"XTerminal Pro ${TAG}\",
              \"body\": \"鑷姩鏋勫缓锛岃闄勪欢涓嬭浇銆俓"
            }"

          RELEASE_ID=$(curl -s \
            "https://gitea.7ping.site/api/v1/repos/${REPO}/releases/tags/${TAG}" \
            -H "Authorization: token ${GITEA_TOKEN}" \
            | python3 -c "import json,sys; print(json.load(sys.stdin)['id'])")

          for f in dist/*/*.deb dist/*/*.msi dist/*/*.dmg; do
            [ -f "$f" ] || continue
            echo "Uploading $(basename $f)..."
            curl -s -X POST \
              "https://gitea.7ping.site/api/v1/repos/${REPO}/releases/${RELEASE_ID}/assets" \
              -H "Authorization: token ${GITEA_TOKEN}" \
              -F "attachment=@${f}"
          done
