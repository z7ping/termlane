name: Build packages

on:
  workflow_dispatch:
    inputs:
      build_windows:
        description: Build Windows MSI
        required: false
        type: boolean
        default: true
      build_linux:
        description: Build Linux DEB
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  windows:
    name: Windows MSI
    if: ${{ inputs.build_windows }}
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Build MSI
        run: npx tauri build --bundles msi

      - name: Upload MSI
        uses: actions/upload-artifact@v4
        with:
          name: termlane-windows-msi
          path: src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 14

  linux:
    name: Linux DEB
    if: ${{ inputs.build_linux }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libdbus-1-dev \
            patchelf \
            pkg-config

      - name: Install dependencies
        run: npm ci

      - name: Build DEB
        run: npx tauri build --bundles deb

      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: termlane-linux-deb
          path: src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error
          retention-days: 14
